<style>

#top{top:calc(14px + env(safe-area-inset-top))!important;left:calc(16px + env(safe-area-inset-left))!important;right:calc(16px + env(safe-area-inset-right))!important}

@media(max-height:480px){#ins{display:none}.ov{gap:8px}}
</style></head><body>
<canvas id="cv"></canvas>
<div id="home" class="ov"><div id="lg" class="seg"><button data-l="fa">فارسی</button><button data-l="en">English</button></div><h1><b>FLIGHT</b> LAB</h1><p id="sub"></p><button class="big" id="play"></button><div id="dots"></div></div>

<div id="pause" class="ov" hidden><h2 id="pt"></h2><button class="big" id="rs"></button><button class="ghost" id="ph"></button><div class="seg"><button data-l="fa">فارسی</button><button data-l="en">English</button></div></div>
<script>
"use strict";
const $=s=>document.querySelector(s),cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const ls={g(k,d){try{return JSON.parse(localStorage.getItem('fl:'+k))??d}catch{return d}},s(k,v){try{localStorage.setItem('fl:'+k,JSON.stringify(v))}catch{}}};
/* ---------- texts ---------- */
const TX={fa:{sub:'حس پرواز را تجربه کن',play:'پرواز',go:'برو',nx:'مرحله بعد',rt:'دوباره',home:'خانه',st:'مرحله',pt:'توقف',rs:'ادامه',lg:'EN',
n:['بلند شدن','پرواز مستقیم','عبور از حلقه‌ها','پایین آمدن آرام','فرود'],
h:['موتور تمام‌قدرت است. وقتی سرعت زیاد شد، ▲ را نگه دار تا بلند شوی؛ بعد تا ۶۰ متر بالا برو.','ارتفاع را روی نوار سبز نگه دار. با ضربه‌های کوچک ▲ و ▼ و کمی تنظیم پیشران.','از داخل حلقه‌ها رد شو. برای بالا رفتن ▲، برای پایین آمدن ▼ و کمی پیشران.','پیشران را کم کن و آرام پایین بیا تا از حلقه‌ها بگذری. باند جلوی توست.','سرعت حدود ۱۱۰ تا ۱۲۵. نزدیک زمین دماغه را نرم بالا بیاور، پیشران را صفر کن و بایست.'],
m:{accel:'سرعت بگیر…',rotate:'حالا ▲ را نگه دار!',climb:'بالا برو!',good:'عالی، همین‌طور',up:'کمی بالاتر',dn:'کمی پایین‌تر',slow:'سرعت کم است!',stall:'دماغه را پایین بیاور!',flare:'دماغه را نرم بالا بیاور',brake:'ترمز خودکار',approach:'آرام و پایدار'},
ok:['','خوب بود','عالی!','بی‌نقص!'],fail:'دوباره امتحان کن',
r:{ground:'به زمین خوردی',control:'کنترل از دست رفت',runway:'باند تمام شد',timeout:'وقت تمام شد',miss:'حلقه‌های کافی نگرفتی',short:'قبل از باند نشستی',long:'خیلی دورتر از شروع باند نشستی',hard:'فرود خیلی محکم بود',unsafe:'سرعت یا زاویه مناسب نبود',overrun:'از باند بیرون زدی',done:'همهٔ مرحله‌ها تمام شد 🎉'}},
en:{sub:'Feel the flight',play:'FLY',go:'Go',nx:'Next stage',rt:'Retry',home:'Home',st:'Stage',pt:'Paused',rs:'Resume',lg:'فارسی',
n:['Take off','Level flight','Fly the rings','Gentle descent','Landing'],
h:['Full power. When you pick up speed, hold ▲ to lift off, then climb to 60 m.','Keep your altitude on the green band. Use small ▲ ▼ taps and a little power.','Fly through the rings. ▲ to climb, ▼ to descend, a bit of power helps.','Reduce power and descend gently through the rings. The runway is ahead.','Speed about 110–125. Near the ground ease the nose up, cut power and stop.'],
m:{accel:'Build speed…',rotate:'Now hold ▲!',climb:'Climb!',good:'Nice, keep it',up:'A bit higher',dn:'A bit lower',slow:'Speed is low!',stall:'Lower the nose!',flare:'Ease the nose up',brake:'Auto braking',approach:'Calm and steady'},
ok:['','Good','Great!','Perfect!'],fail:'Try again',
r:{ground:'You hit the ground',control:'Lost control',runway:'Ran out of runway',timeout:'Out of time',miss:'Too many rings missed',short:'Touched down before the runway',long:'Touched down too far down',hard:'Landing was too hard',unsafe:'Speed or angle was off',overrun:'Ran off the runway',done:'All stages complete 🎉'}}};
let lang=ls.g('lang',(navigator.language||'').startsWith('fa')?'fa':'en');const T=()=>TX[lang];
/* ---------- physics (same model as v0.1) ---------- */
const DT=1/120,M=850,S=16,G=9.81;
function mk(i){const b={x:0,h:120,vx:40,vy:0,p:.06,q:0,t:.44,e:0,fl:0,flT:0,time:0,gnd:false,roll:false,comp:0,sp:40,al:0};
 if(i==0)Object.assign(b,{h:0,vx:0,p:0,t:1,roll:true,sp:0});
 if(i==3)Object.assign(b,{h:170,vx:38,sp:38});
 if(i==4)Object.assign(b,{x:70,h:44,vx:34,vy:-2.2,p:-.015,t:.26,fl:1,flT:1,sp:34.1});return b}
function step(s,inp,dt,dist){
 s.time+=dt;s.e=cl(inp.e,-1,1);s.t=cl(inp.t,0,1);s.fl+=cl(s.flT-s.fl,-dt*.65,dt*.65);s.sp=Math.hypot(s.vx,s.vy);s.comp=Math.max(0,s.comp-dt*1.5);
 if(s.gnd){s.vx=Math.max(0,s.vx+(s.t*1650/M-1.8-.0018*s.vx*s.vx)*dt);s.x+=s.vx*dt;s.p+=(0-s.p)*dt*4;s.q=0;s.vy=0;s.h=0;return}
 const g=s.roll?0:Math.atan2(s.vy,s.vx),a=s.p-g;s.al=a;
 let c=.25+4.8*a+.22*s.fl;if(Math.abs(a)>.28)c*=Math.max(.22,1-(Math.abs(a)-.28)*3.2);c=cl(c,-1.3,1.65);
 const cd=.032+.065*c*c+.025*s.fl+(Math.abs(a)>.28?.2:0),Q=.5*1.225*s.sp*s.sp*S,Lf=Q*c,D=Q*cd,T=1650*s.t;
 s.q+=(1.5*s.e*cl((s.sp/40)**2,.15,1.8)-2.5*s.q-.9*(a-.06)+dist)*dt;s.p+=s.q*dt;
 if(s.roll){s.vx=Math.max(0,s.vx+(T*Math.cos(s.p)-D-.03*Math.max(0,M*G-Lf)-.0015*s.vx*s.vx)/M*dt);
  if(s.p<0){s.p=0;s.q=Math.max(0,s.q)}if(s.p>.26){s.p=.26;s.q=Math.min(0,s.q)}
  if(Lf*Math.cos(s.p)>M*G&&s.vx>12){s.roll=false;s.vy=.05}else{s.x+=s.vx*dt;s.vy=0;s.h=0;return}}
 s.vx+=(T*Math.cos(s.p)-D*Math.cos(g)-Lf*Math.sin(g))/M*dt;
 s.vy+=((T*Math.sin(s.p)-D*Math.sin(g)+Lf*Math.cos(g))/M-G)*dt;s.x+=s.vx*dt;s.h+=s.vy*dt}
/* ---------- stages ---------- */
const ST=[{rs:-80,re:1100,rings:[],d:0},{rs:-9e3,re:-8e3,rings:[],d:1},
{rs:-9e3,re:-8e3,d:.5,rings:[[350,135],[700,160],[1050,130],[1400,100],[1750,125]]},
{rs:1900,re:2800,d:.4,rings:[[330,150],[660,125],[990,100],[1320,75],[1650,50]]},{rs:650,re:1550,rings:[],d:0}];
const PAL=[{a:'#456fa6',b:'#f0b48f',c:'#fbdcaf',m:'#6b7fa6',s:'#fff0c0',sx:.8,sy:.7,cl:'#ffe9d2'},
{a:'#2a78c8',b:'#7fbbea',c:'#dff0f8',m:'#6d8cb5',s:'#fffbe0',sx:.72,sy:.16,cl:'#ffffff'},
{a:'#2f80cf',b:'#8fcbee',c:'#eaf3df',m:'#6a8fb0',s:'#fffbe0',sx:.25,sy:.2,cl:'#ffffff'},
{a:'#3b5f9c',b:'#d9a58a',c:'#f6d6a4',m:'#7a7fa6',s:'#ffe3a8',sx:.2,sy:.6,cl:'#fff0dc'},
{a:'#2a3d78',b:'#e0806a',c:'#ffc57e',m:'#6a5f8a',s:'#ffd890',sx:.82,sy:.68,cl:'#ffd9c0'}];
let m=null,scr='home',thr=.44,acc=0,last=0,clock=0,stars=ls.g('stars',[0,0,0,0,0]);
const newM=i=>({i,s:mk(i),done:ST[i].rings.map(()=>0),inb:0,res:null,touch:null});
function fin(st,r){m.res={st,r};return 1}
function tick(inp){const s=m.s,i=m.i,c=ST[i],was=s.gnd;
 step(s,inp,DT,c.d*(.055*Math.sin(s.time*.75)+.035*Math.sin(s.time*1.8)));
 if(!Number.isFinite(s.x+s.h+s.p+s.vx)||Math.abs(s.p)>1.1||(s.vx<10&&!s.roll&&!s.gnd)||s.h>400)return fin(0,'control');
 if(i==0){if(s.roll){if(s.x>c.re)return fin(0,'runway');if(s.time>80)return fin(0,'timeout')}else{if(s.h<=0)return fin(0,'ground');if(s.h>=60)return fin(s.time<=32?3:s.time<=45?2:1)}}
 else if(i==1){if(Math.abs(s.h-120)<12)m.inb+=DT;if(s.h<=0)return fin(0,'ground');if(s.time>=20){const f=m.inb/20;fin(f>=.8?3:f>=.5?2:1)}}
 else if(i<4){c.rings.forEach((r,k)=>{if(!m.done[k]&&s.x>=r[0]){m.done[k]=Math.abs(s.h-r[1])<=24?1:2;snd.ping(m.done[k]==1?'ring':'miss')}});
  if(s.h<=0)return fin(0,'ground');
  if(m.done.every(v=>v)&&s.x>c.rings[c.rings.length-1][0]+50){const n=m.done.filter(v=>v==1).length;n>=3?fin(n==5?3:n==4?2:1):fin(0,'miss')}}
 else{if(!was&&!s.gnd&&s.h<=0){const f=s.x<c.rs?'short':s.x>1100?'long':s.vy<-4?'hard':(s.sp>45||s.sp<20||s.p<-.1||s.p>.32)?'unsafe':0;if(f)return fin(0,f);
   m.touch={x:s.x,vy:s.vy};s.h=0;s.gnd=true;s.comp=Math.min(1,Math.abs(s.vy)/3.5);s.vy=0;snd.ping('t')}
  if(s.x>c.re)fin(0,'overrun');else if(s.gnd&&s.vx<1){const v=Math.abs(m.touch.vy);fin(v<1.4?3:v<2.5?2:1)}else if(s.time>100)fin(0,'timeout')}}
/* ---------- input ---------- */
const K=new Set(),B={e:0,t:0};
const read=dt=>{const h=(...a)=>a.some(k=>K.has(k));const d=B.t||(+h('d','arrowright')-+h('a','arrowleft'));thr=cl(thr+d*dt*.3,0,1);return{e:B.e||(+h('w','arrowup')-+h('s','arrowdown')),t:thr}};
addEventListener('keydown',e=>{const k=e.key.toLowerCase();
 if('arrowup arrowdown arrowleft arrowright w a s d p'.split(' ').includes(k)){e.preventDefault();K.add(k);if(k=='p'&&!e.repeat)togglePause()}
 else if((k==' '||k=='enter')&&!e.repeat){const b=[...document.querySelectorAll('.ov:not([hidden]) .big')][0];if(b){e.preventDefault();b.click()}}});
addEventListener('keyup',e=>K.delete(e.key.toLowerCase()));
const clr=()=>{K.clear();B.e=B.t=0;document.querySelectorAll('.rb.on').forEach(b=>b.classList.remove('on'))};
addEventListener('blur',()=>{clr();if(scr=='fly')setPause(1)});document.addEventListener('visibilitychange',()=>{if(document.hidden&&scr=='fly')setPause(1)});
addEventListener('contextmenu',e=>e.preventDefault());
document.querySelectorAll('.rb').forEach(b=>{const k=b.dataset.e?'e':'t',v=+(b.dataset.e||b.dataset.t);
 b.onpointerdown=ev=>{ev.preventDefault();B[k]=v;b.classList.add('on')};b.onpointerup=b.onpointercancel=b.onpointerleave=()=>{if(B[k]==v)B[k]=0;b.classList.remove('on')}});
/* ---------- sound (starts after the first button press) ---------- */
const snd={on:true,x:null,
 init(){if(this.x){this.x.resume();return}try{const A=window.AudioContext||window.webkitAudioContext,x=this.x=new A(),o=x.createOscillator(),f=x.createBiquadFilter(),g=x.createGain();o.type='sawtooth';f.type='lowpass';f.frequency.value=380;g.gain.value=0;o.connect(f);f.connect(g);g.connect(x.destination);o.start();this.o=o;this.g=g}catch{}},
 set(t,on){if(!this.x)return;const n=this.x.currentTime;this.o.frequency.setTargetAtTime(42+t*62,n,.1);this.g.gain.setTargetAtTime(this.on&&on?.05+t*.05:0,n,.12)},
 ping(k){if(!this.x||!this.on)return;const x=this.x,o=x.createOscillator(),g=x.createGain(),f={ring:880,miss:180,t:130,win:660}[k]||400;o.type='sine';o.frequency.value=f;o.connect(g);g.connect(x.destination);g.gain.setValueAtTime(.07,x.currentTime);g.gain.exponentialRampToValueAtTime(.001,x.currentTime+.35);o.start();o.stop(x.currentTime+.36)}};
/* ---------- screens ---------- */
function show(n){scr=n;for(const x of['home','card','end','pause'])$('#'+x).hidden=x!=n;$('#hud').hidden=n=='home'||n=='card';clr()}
function texts(){const t=T();document.documentElement.lang=lang;document.documentElement.dir=lang=='fa'?'rtl':'ltr';
 $('#sub').textContent=t.sub;$('#play').textContent=t.play;document.querySelectorAll('.seg button').forEach(b=>{b.classList.toggle('on',b.dataset.l==lang);b.onclick=()=>{lang=b.dataset.l;ls.s('lang',lang);texts()}});$('#go').textContent=t.go;$('#nx').textContent=t.nx;$('#rt').textContent=t.rt;$('#eh').textContent=t.home;$('#pt').textContent=t.pt;$('#rs').textContent=t.rs;$('#ph').textContent=t.home;
 $('#dots').innerHTML=[0,1,2,3,4].map(i=>`<button data-i="${i}">${i+1}<small>${'★'.repeat(stars[i])}</small></button>`).join('');
 $('#dots').querySelectorAll('button').forEach(b=>b.onclick=()=>{snd.init();start(+b.dataset.i)});
 if(m){$('#sn').textContent=(m.i+1)+' / 5 · '+t.n[m.i];$('#cs').textContent=t.st+' '+(m.i+1)+' / 5';$('#cn').textContent=t.n[m.i];$('#ch').textContent=t.h[m.i]}}
function start(i,skip){m=newM(i);thr=m.s.t;acc=0;texts();show(skip?'fly':'card')}
function endScreen(){const t=T(),r=m.res,i=m.i;snd.ping(r.st?'win':'miss');
 if(r.st>stars[i]){stars[i]=r.st;ls.s('stars',stars)}texts();
 $('#stars').innerHTML=r.st?'★'.repeat(r.st)+'<s>'+'★'.repeat(3-r.st)+'</s>':'';
 $('#et').textContent=r.st?t.ok[r.st]:t.fail;$('#er').textContent=r.st?(i==4?t.r.done:''):t.r[r.r];$('#nx').hidden=!(r.st&&i<4);show('end');$('#nx').hidden=!(r.st&&i<4)}
function setPause(v){if(scr=='fly'&&v)show('pause');else if(scr=='pause'&&!v){show('fly');acc=0}}
function togglePause(){setPause(scr=='fly')}
$('#play').onclick=()=>{snd.init();const f=stars.findIndex(v=>!v);start(f<0?0:f)};
$('#go').onclick=()=>show('fly');$('#rt').onclick=()=>start(m.i,1);$('#nx').onclick=()=>start(m.i+1);
$('#eh').onclick=$('#ph').onclick=()=>{texts();show('home')};$('#rs').onclick=()=>setPause(0);$('#pb').onclick=togglePause;

$('#snd').onclick=()=>{snd.on=!snd.on;$('#snd').style.opacity=snd.on?1:.45};
function hud(){const s=m.s,i=m.i,c=ST[i],t=T();$('#vs').textContent=Math.round(s.sp*3.6);$('#va').textContent=Math.max(0,Math.round(s.h));$('#pwb').style.width=thr*100+'%';
 let k,g='';
 if(Math.abs(s.al)>.28&&!s.roll&&!s.gnd)k='stall';
 else if(i==0){k=s.roll?(s.sp<22?'accel':'rotate'):'climb';g=Math.round(s.h)+' / 60 m'}
 else if(i==1){const d=s.h-120;k=Math.abs(d)<12?'good':d>0?'dn':'up';g=Math.max(0,Math.ceil(20-s.time))+' s'}
 else if(i<4){const n=m.done.findIndex(v=>!v),r=c.rings[n<0?c.rings.length-1:n],d=s.h-r[1];k=Math.abs(d)<18?'good':d>0?'dn':'up';g='◎ '+m.done.filter(v=>v==1).length+' / 5'}
 else{k=s.gnd?'brake':s.h<8?'flare':s.sp<24?'slow':'approach';g=Math.max(0,Math.round(c.re-s.x))+' m'}
 const e=$('#msg');e.textContent=t.m[k];e.className=k=='good'?'ok':k=='stall'||k=='slow'?'bad':'';$('#goal').textContent=g}
