*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0d2236;color:#fff;font-family:Vazirmatn,"Segoe UI",Tahoma,system-ui,sans-serif;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%}

[hidden]{display:none!important}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;padding:24px;background:radial-gradient(ellipse at 50% 55%,#0a1c3040,#0a1c30c8)}

#sub{letter-spacing:.06em;opacity:.8;margin-bottom:12px}
.big{background:linear-gradient(#e8cf9d,#caa875);color:#14283b;font-weight:700;font-size:21px;padding:16px 60px;border-radius:44px;box-shadow:0 10px 34px #0007;transition:transform .15s}

.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}

#hud>*{pointer-events:auto}

#msg{position:absolute;top:70px;width:100%;text-align:center;font-size:clamp(20px,3.6vw,30px);font-weight:600;text-shadow:0 2px 14px #0009;pointer-events:none;transition:color .2s}
#msg.ok{color:#9dffc0}#msg.bad{color:#ff9d8e}

#ins{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:18px;align-items:center;padding:10px 20px;border-radius:30px;background:#0a1c3055;backdrop-filter:blur(8px);font-size:14px;pointer-events:none;white-space:nowrap}
#ins b{font-size:20px;font-weight:600}.bar{width:70px;height:6px;border-radius:4px;background:#ffffff30;overflow:hidden}.bar i{display:block;height:100%;background:#d9b878}
#ctl>div{position:absolute;bottom:18px;display:flex;gap:12px}#ctl>div:first-child{left:18px}#ctl>div:last-child{right:18px}
.rb{width:clamp(58px,10vw,76px);height:clamp(58px,10vw,76px);border-radius:50%;background:#0a1c3066;backdrop-filter:blur(8px);border:2px solid #ffffff44;font-size:24px;touch-action:none}
.rb.on{background:#d9b878cc;color:#14283b}
#stars{font-size:54px;letter-spacing:8px;color:#d9b878;direction:ltr}#stars s{text-decoration:none;opacity:.22}
@media(orientation:portrait){#ins{bottom:calc(104px + env(safe-area-inset-bottom))}}

.ov{gap:8px;overflow-y:auto;touch-action:pan-y}

#ins>div{display:flex;flex-direction:column;align-items:center;min-width:66px;line-height:1.3}#ins small{opacity:.7;font-size:11px;letter-spacing:.08em}#ins .bar{margin-top:4px;width:56px}
#tip{position:absolute;bottom:100px;left:50%;transform:translateX(-50%);width:min(92%,440px);padding:12px 16px;border-radius:16px;background:#0a1c30c4;backdrop-filter:blur(10px);border:1px solid #ffffff30;font-size:14px;line-height:1.7;pointer-events:none;opacity:0;transition:opacity .3s}
#tip.on{opacity:1}#tip b{color:#d9b878;display:block;font-size:15px}
@media(orientation:portrait){#tip{bottom:calc(190px + env(safe-area-inset-bottom))}}

#atc{position:absolute;top:150px;left:50%;transform:translateX(-50%);width:min(92%,420px);padding:10px 14px 12px;border-radius:16px;background:#0b2035dd;backdrop-filter:blur(10px);border:1px solid #7fd0ff55;border-inline-start:4px solid #7fd0ff;font-size:14px;line-height:1.55;direction:ltr;text-align:left}
#atc small{display:block;color:#7fd0ff;letter-spacing:.12em;font-size:11px}#atc .you small{color:#d9b878}#atc .fa{opacity:.88;margin-top:4px;font-size:13px;text-align:right}
#rb{margin-top:8px;width:100%;padding:11px 12px;border-radius:12px;background:linear-gradient(#e8cf9d,#caa875);color:#14283b;font-weight:700;font-size:14px}
@media(orientation:landscape){#atc{top:60px;left:auto;right:calc(18px + env(safe-area-inset-right));transform:none;width:min(40%,350px)}#msg,#goal{width:58%}#goal{top:102px;font-size:14px}}

.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:560px}.chips span{background:#ffffff22;border:1px solid #ffffff30;border-radius:20px;padding:5px 14px;font-size:14px}.chips span.k{background:#d9b87830;border-color:#d9b878}
